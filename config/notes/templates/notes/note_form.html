<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Створення нотатки</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">🗒️ Мій Проєкт</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">Головна</a>
                <a class="nav-link active" href="">➕ Створити нотатку</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row">

            <div class="col-md-6 mb-4">
                <div class="card shadow p-4 border-top border-success border-4">
                    <h2 class="mb-4 text-center text-success fw-bold">Нова нотатка</h2>

                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-3">
                            {{ form.as_p }}
                        </div>

                        <button type="submit" class="btn btn-success w-100 btn-lg shadow-sm">💾 Зберегти нотатку</button>
                    </form>
                </div>
            </div>

            <div class="col-md-6 mb-4">
                <div class="card shadow p-4">
                    <h2 class="mb-4 text-primary fw-bold">Мої нотатки:</h2>

                    <div class="list-group">
                        {% for note in notes %}
                            <a href="{% url 'note_detail_edit' note.pk %}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center fw-medium">
                                📝 {{ note.title }}
                                <span class="badge bg-primary rounded-pill">Редагувати →</span>
                            </a>
                        {% empty %}
                            <div class="alert alert-info text-center" role="alert">
                                📭 Нотаток ще немає. Створіть першу!
                            </div>
                        {% endfor %}
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
