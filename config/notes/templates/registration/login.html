<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Вхід у систему</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-4">
                <div class="card shadow p-4 border-top border-primary border-4">
                    <h2 class="text-center mb-4 text-primary fw-bold">Вхід до нотаток</h2>

                    {% if form.errors %}
                        <div class="alert alert-danger text-center p-2" role="alert">
                            Неправильний логін або пароль!
                        </div>
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            {{ form.as_p }}
                        </div>

                        <button type="submit" class="btn btn-primary w-100 btn-lg shadow-sm">🔑 Увійти</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
