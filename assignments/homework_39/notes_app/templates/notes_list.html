{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Мої Нотатки</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <h1>Список нотаток</h1>

    <div class="notes-container">
        {% for note in notes %}
            <div class="note-card">
                <h3>{{ note.title }}</h3>
                <p>{{ note.content }}</p>
                <div class="note-date">Дата: {{ note.created_at }}</div>
            </div>
        {% empty %}
            <p>Нотаток поки немає.</p>
        {% endfor %}
    </div>
</body>
</html>
